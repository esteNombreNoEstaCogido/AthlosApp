<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Athlos - Tu entrenamiento personalizado. Rutinas, seguimiento y progreso." />

    <!-- PWA -->
    <meta name="apple-mobile-web-app-title" content="Athlos" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1616/1616487.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Lock portrait + safe area padding -->
    <style>
      @media screen and (orientation: landscape) {
        body::after {
          content: "Por favor, gira tu dispositivo a vertical";
          position: fixed; inset: 0; z-index: 99999;
          display: flex; align-items: center; justify-content: center;
          background: #09090b; color: #f59e0b;
          font-size: 1.2rem; font-weight: bold; text-align: center; padding: 2rem;
        }
      }
      body { padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>

    <!-- Open Graph (previews en WhatsApp, Instagram, etc.) -->
    <meta property="og:title" content="Athlos - Entrenamiento Premium" />
    <meta property="og:description" content="Tu entrenamiento personalizado. Rutinas, seguimiento y progreso. ⚡" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/1616/1616487.png" />

    <title>Athlos</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
