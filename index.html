<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Athlos - Tu entrenamiento personalizado. Rutinas, seguimiento y progreso." />

    <!-- Security Headers -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <!-- PWA -->
    <meta name="apple-mobile-web-app-title" content="Athlos" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Icons (fondo negro + logo dorado) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180x180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512x512.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Splash Screen Color -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Safe area padding + lock portrait via Screen Orientation API -->
    <style>
      html, body {
        background-color: #09090b;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      body {
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }
    </style>
    <script>
      screen.orientation && screen.orientation.lock && screen.orientation.lock("portrait").catch(function(){});
    </script>

    <!-- Open Graph (previews en WhatsApp, Instagram, etc.) -->
    <meta property="og:title" content="Athlos - Entrenamiento Premium" />
    <meta property="og:description" content="Tu entrenamiento personalizado. Rutinas, seguimiento y progreso. ⚡" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512x512.png" />

    <title>Athlos</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
